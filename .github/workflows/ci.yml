name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    env:
      VERAPOLITICA_DATABASE_URL: sqlite:///./.ci/verapolitica.db
      VERAPOLITICA_RAW_STORAGE_PATH: ./.ci/raw
      VERAPOLITICA_ADMIN_API_KEY: ci-test-key-not-a-secret
      VERAPOLITICA_ADMIN_REVIEWER_IDENTITY: ci-test-editor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest -q
