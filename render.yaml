# Staging web service. The database already exists in this Render workspace;
# fromDatabase injects its internal URL without copying the password into git.
services:
  - type: web
    name: verapolitica-staging
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /health/live
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free instances cannot SSH or run a one-off job. This start command
    # migrates the service's own database, then serves traffic.
    dockerCommand: /bin/sh -c "python -m alembic upgrade head && exec python -m scripts.run_web"
    envVars:
      - key: VERAPOLITICA_DATABASE_URL
        fromDatabase:
          name: verapolitica-staging-db
          property: connectionString
