# Staging web service. The database already exists in this Render workspace;
# fromDatabase injects its internal URL without copying the password into git.
services:
  - type: web
    name: verapolitica-staging
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /health/live
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free instances cannot SSH, run a one-off job, or use a pre-deploy
    # command. Render executes this as one program, then the script migrates
    # the service's own database and starts the web process.
    dockerCommand: python -m scripts.run_migrated_web
    envVars:
      - key: VERAPOLITICA_DATABASE_URL
        fromDatabase:
          name: verapolitica-staging-db
          property: connectionString
