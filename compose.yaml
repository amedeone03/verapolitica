# Local production-like stack for VeraPolitica.
# Development-only credentials live in `.env.production.example` and the
# POSTGRES_* defaults below. Never use them on a public VPS.
#
# Required: copy `.env.production.example` to `.env.production` (gitignored).
#   docker compose --env-file .env.production up --build
#   ./scripts/run_production_compose.sh up --build
#
# Scheduler is opt-in and stays disabled unless you pass --profile scheduler.

name: verapolitica

x-app-env: &app-env
  env_file:
    - .env.production
  environment:
    # Compose DNS name `db` must win over any VPS hostname in the env file.
    VERAPOLITICA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-verapolitica}:${POSTGRES_PASSWORD:-verapolitica}@db:5432/${POSTGRES_DB:-verapolitica}
    VERAPOLITICA_RAW_STORAGE_PATH: /var/lib/verapolitica/raw
    VERAPOLITICA_WEB_HOST: 0.0.0.0

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verapolitica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verapolitica}
      POSTGRES_DB: ${POSTGRES_DB:-verapolitica}
    volumes:
      - verapolitica_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verapolitica} -d ${POSTGRES_DB:-verapolitica}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app-env
    build: .
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-env
    build: .
    command: python -m scripts.run_web
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - verapolitica_raw:/var/lib/verapolitica/raw
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    <<: *app-env
    profiles: ["scheduler"]
    build: .
    command: python -m scripts.run_scheduler
    volumes:
      - verapolitica_raw:/var/lib/verapolitica/raw
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  verapolitica_pg:
  verapolitica_raw:
